
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlockCraft - Minecraft Web Game</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #87ceeb;
  color: white;
  user-select: none;
}

canvas {
  display: block;
}

#menu {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: linear-gradient(#0005, #000c);
}

#menu h1 {
  font-size: clamp(42px, 9vw, 90px);
  margin: 0 0 10px;
  color: #76ed45;
  text-shadow: 4px 4px #28521a;
  letter-spacing: 4px;
}

#menu p {
  line-height: 1.8;
}

button {
  padding: 16px 55px;
  margin: 20px;
  border: 3px solid white;
  background: #579b35;
  color: white;
  font-size: 22px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 5px #28521a;
}

button:hover {
  background: #70c344;
}

.help {
  font-size: 14px;
  color: #ddd;
}

#crosshair {
  position: fixed;
  z-index: 2;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  font-size: 30px;
  text-shadow: 1px 1px black;
  pointer-events: none;
}

#hud {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
}

#coordinates {
  position: absolute;
  top: 15px;
  left: 15px;
  padding: 10px;
  background: #0006;
  font-size: 14px;
}

#hotbar {
  position: absolute;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 5px;
  padding: 6px;
  background: #222b;
  border: 2px solid #777;
}

.slot {
  width: 54px;
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 27px;
  background: #777b;
  border: 3px solid #444;
}

.slot.selected {
  border: 3px solid white;
  background: #aaa9;
  transform: translateY(-4px);
}

#status {
  position: absolute;
  bottom: 100px;
  width: 100%;
  text-align: center;
  text-shadow: 1px 2px black;
}

@media (max-width: 500px) {
  .slot {
    width: 42px;
    height: 42px;
    font-size: 22px;
  }

  #hotbar {
    gap: 2px;
  }
}
</style>
</head>

<body>

<div id="crosshair">+</div>

<div id="menu">
  <h1>BLOCKCRAFT</h1>
  <p>Build your own block world!</p>
  <button id="play">PLAY GAME</button>
  <p class="help">
    WASD: Move · Mouse: Look<br>
    Left Click: Break · Right Click: Place<br>
    1–5: Select Block · Space: Jump · ESC: Pause
  </p>
</div>

<div id="hud">
  <div id="coordinates">BlockCraft Survival</div>
  <div id="hotbar"></div>
  <div id="status">Click PLAY GAME to begin</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
(() => {
  if (!window.THREE) {
    document.getElementById("menu").innerHTML =
      "<h1>BLOCKCRAFT</h1><p>Could not load 3D graphics. Check your internet connection and reload.</p>";
    return;
  }

  // SETUP
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb);
  scene.fog = new THREE.Fog(0x87ceeb, 20, 70);

  const camera = new THREE.PerspectiveCamera(
    75, window.innerWidth / window.innerHeight, 0.1, 1000
  );

  const renderer = new THREE.WebGLRenderer({ antialias: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x64734c, 2));

  const sun = new THREE.DirectionalLight(0xffffff, 2);
  sun.position.set(10, 25, 10);
  scene.add(sun);

  // BLOCK TYPES
  const materials = {
    grass: new THREE.MeshLambertMaterial({ color: 0x58a83b }),
    dirt: new THREE.MeshLambertMaterial({ color: 0x80512e }),
    stone: new THREE.MeshLambertMaterial({ color: 0x888888 }),
    wood: new THREE.MeshLambertMaterial({ color: 0x98652e }),
    sand: new THREE.MeshLambertMaterial({ color: 0xdac57a })
  };

  const icons = {
    grass: "🟩",
    dirt: "🟫",
    stone: "⬜",
    wood: "🪵",
    sand: "🟨"
  };

  const blockNames = Object.keys(materials);
  const blocks = [];
  const blockGeometry = new THREE.BoxGeometry(1, 1, 1);

  function addBlock(x, y, z, type = "grass") {
    const block = new THREE.Mesh(blockGeometry, materials[type]);
    block.position.set(x, y, z);
    block.userData.type = type;
    scene.add(block);
    blocks.push(block);
    return block;
  }

  // GENERATE TERRAIN
  for (let x = -15; x <= 15; x++) {
    for (let z = -15; z <= 15; z++) {
      const height = Math.floor(
        1 + Math.sin(x * 0.35) * 1.2 +
        Math.cos(z * 0.3) * 1.1
      );

      for (let y = -2; y <= height; y++) {
        let type = "dirt";

        if (y === height) {
          type = height < 1 ? "sand" : "grass";
        } else if (y < height - 2) {
          type = "stone";
        }

        addBlock(x, y, z, type);
      }
    }
  }

  // GENERATE TREES
  for (let i = 0; i < 12; i++) {
    const x = Math.floor(Math.random() * 24 - 12);
    const z = Math.floor(Math.random() * 24 - 12);

    for (let y = 1; y <= 3; y++) {
      addBlock(x, y, z, "wood");
    }

    for (let dx = -2; dx <= 2; dx++) {
      for (let dz = -2; dz <= 2; dz++) {
        for (let dy = 3; dy <= 5; dy++) {
          if (Math.abs(dx) + Math.abs(dz) < 4) {
            addBlock(x + dx, dy, z + dz, "grass");
          }
        }
      }
    }
  }

  // PLAYER
  const player = {
    x: 0,
    y: 5,
    z: 8,
    speed: 6
  };

  let yaw = 0;
  let pitch = 0;
  let velocityY = 0;
  let grounded = false;
  let playing = false;
  let selected = "grass";

  const keys = {};
  const clock = new THREE.Clock();

  const raycaster = new THREE.Raycaster();
  raycaster.far = 7;

  const menu = document.getElementById("menu");
  const status = document.getElementById("status");
  const hotbar = document.getElementById("hotbar");

  // HOTBAR
  function updateHotbar() {
    hotbar.innerHTML = "";

    blockNames.forEach((type, index) => {
      const slot = document.createElement("div");
      slot.className =
        "slot" + (selected === type ? " selected" : "");
      slot.textContent = icons[type];
      slot.title = (index + 1) + ": " + type;
      hotbar.appendChild(slot);
    });
  }

  updateHotbar();

  // START GAME
  document.getElementById("play").addEventListener("click", () => {
    renderer.domElement.requestPointerLock();
  });

  document.addEventListener("pointerlockchange", () => {
    playing = document.pointerLockElement === renderer.domElement;
    menu.style.display = playing ? "none" : "flex";

    status.textContent = playing
      ? "Explore and build!"
      : "Click PLAY GAME to continue";
  });

  // MOUSE LOOK
  document.addEventListener("mousemove", event => {
    if (!playing) return;

    yaw -= event.movementX * 0.002;
    pitch -= event.movementY * 0.002;
    pitch = Math.max(-1.5, Math.min(1.5, pitch));

    camera.rotation.order = "YXZ";
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;
  });

  // KEYBOARD
  document.addEventListener("keydown", event => {
    keys[event.code] = true;

    if (
      ["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"]
        .includes(event.code)
    ) {
      event.preventDefault();
    }

    const number = Number(event.key);

    if (number >= 1 && number <= 5) {
      selected = blockNames[number - 1];
      updateHotbar();
    }

    if (event.code === "Space" && grounded && playing) {
      velocityY = 7;
      grounded = false;
    }
  });

  document.addEventListener("keyup", event => {
    keys[event.code] = false;
  });

  // FIND TARGET BLOCK
  function getTarget() {
    raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
    const hits = raycaster.intersectObjects(blocks, false);
    return hits.length ? hits[0] : null;
  }

  document.addEventListener("contextmenu", event => {
    event.preventDefault();
  });

  // BREAK AND PLACE BLOCKS
  document.addEventListener("mousedown", event => {
    if (!playing) return;

    const hit = getTarget();
    if (!hit) return;

    const block = hit.object;
    const p = block.position;

    if (event.button === 0) {
      // Preserve the bottom layer.
      if (p.y <= -2) return;

      scene.remove(block);

      const index = blocks.indexOf(block);
      if (index !== -1) blocks.splice(index, 1);
    }

    if (event.button === 2) {
      const normal = hit.face.normal.clone();
      normal.transformDirection(block.matrixWorld);

      const x = Math.round(p.x + normal.x);
      const y = Math.round(p.y + normal.y);
      const z = Math.round(p.z + normal.z);

      // Avoid placing blocks inside the player's body.
      if (
        Math.abs(x - player.x) < 0.8 &&
        Math.abs(z - player.z) < 0.8 &&
        y > player.y - 2 &&
        y < player.y + 1
      ) {
        return;
      }

      const occupied = blocks.some(b =>
        b.position.x === x &&
        b.position.y === y &&
        b.position.z === z
      );

      if (!occupied) {
        addBlock(x, y, z, selected);
      }
    }
  });

  // GAME LOOP
  function animate() {
    requestAnimationFrame(animate);

    const dt = Math.min(clock.getDelta(), 0.05);

    if (playing) {
      const forward = new THREE.Vector3(
        -Math.sin(yaw), 0, -Math.cos(yaw)
      );

      const right = new THREE.Vector3(
        Math.cos(yaw), 0, -Math.sin(yaw)
      );

      const move = new THREE.Vector3();

      if (keys.KeyW || keys.ArrowUp) move.add(forward);
      if (keys.KeyS || keys.ArrowDown) move.sub(forward);
      if (keys.KeyD || keys.ArrowRight) move.add(right);
      if (keys.KeyA || keys.ArrowLeft) move.sub(right);

      if (move.lengthSq() > 0) {
        move.normalize().multiplyScalar(player.speed * dt);
        player.x += move.x;
        player.z += move.z;
      }

      // GRAVITY AND JUMPING
      velocityY -= 18 * dt;
      player.y += velocityY * dt;

      // BASIC GROUND COLLISION
      let groundY = -1.5;

      for (const block of blocks) {
        const p = block.position;

        if (
          Math.abs(p.x - player.x) < 0.45 &&
          Math.abs(p.z - player.z) < 0.45 &&
          p.y + 0.5 <= player.y - 1.5 &&
          p.y + 0.5 > groundY
        ) {
          groundY = p.y + 0.5;
        }
      }

      if (player.y < groundY + 2) {
        player.y = groundY + 2;
        velocityY = 0;
        grounded = true;
      } else {
        grounded = false;
      }

      player.x = THREE.MathUtils.clamp(player.x, -15, 15);
      player.z = THREE.MathUtils.clamp(player.z, -15, 15);

      camera.position.set(player.x, player.y, player.z);

      document.getElementById("coordinates").textContent =
        "X: " + player.x.toFixed(1) +
        " Y: " + player.y.toFixed(1) +
        " Z: " + player.z.toFixed(1);
    }

    renderer.render(scene, camera);
  }

  // RESIZE
  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate();
})();
</script>

</body>
</html>
