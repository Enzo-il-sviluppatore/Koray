<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Blockcraft</title>
<style>
:root{--panel:rgba(255,255,255,.9);--ink:#1d2419;--sel:#ffd23f;--veil:rgba(20,30,15,.55);--ss:min(44px,calc((100vw - 76px)/9))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:rgba(24,30,22,.9);--ink:#eef3e8;--veil:rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--panel:rgba(24,30,22,.9);--ink:#eef3e8;--veil:rgba(0,0,0,.6)}
html,body{margin:0;height:100%;overflow:hidden;background:#8ec9ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#cross{position:fixed;left:50%;top:50%;width:20px;height:20px;margin:-10px;pointer-events:none;mix-blend-mode:difference}
#cross:before,#cross:after{content:"";position:absolute;background:#fff}
#cross:before{left:9px;top:0;width:2px;height:20px}
#cross:after{top:9px;left:0;height:2px;width:20px}
#pos{position:fixed;left:calc(10px + env(safe-area-inset-left,0px));top:calc(8px + env(safe-area-inset-top,0px));z-index:3;font:600 12px system-ui;color:#fff;text-shadow:0 0 3px #000;pointer-events:none}
#hint{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));top:calc(8px + env(safe-area-inset-top,0px));z-index:3;font:600 12px system-ui;color:#fff;text-shadow:0 0 3px #000;pointer-events:none}
.touch #hint{display:none}
#dmg{position:fixed;inset:0;z-index:7;pointer-events:none;background:radial-gradient(transparent 40%,rgba(200,0,0,.7));opacity:0}
#pv{position:fixed;inset:0;z-index:6;pointer-events:none;background:radial-gradient(circle,rgba(130,50,210,.35),rgba(80,20,160,.9));opacity:0}
#msg{position:fixed;top:16%;left:50%;transform:translateX(-50%);z-index:8;padding:8px 16px;border-radius:10px;background:var(--panel);color:var(--ink);opacity:0;transition:opacity .4s;pointer-events:none;font-weight:600}
#hud{position:fixed;z-index:3;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:5px}
#name{padding:2px 8px;color:#fff;font:700 14px system-ui;min-height:18px;text-shadow:1px 1px 0 #000,0 0 4px #000}
#bar{display:flex;gap:2px;padding:3px;background:rgba(0,0,0,.55);border:2px solid #000}
#hp{display:none;gap:1px}
.surv #hp{display:flex}
#hp span{color:#444;font-size:16px;line-height:1;text-shadow:0 0 2px #000}
#hp .f{color:#e53935}
#hp .h{color:#ff9a3d}
.sl{width:var(--ss);height:var(--ss);box-sizing:border-box;border-radius:0;border:2px solid;border-color:#373737 #fff #fff #373737;background:#8b8b8b;position:relative;cursor:pointer;overflow:hidden;touch-action:pan-y}
.sl.on{border:2px solid #fff;box-shadow:inset 0 0 0 2px #1d1d1d}
.sl canvas,#cur canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.sl b,#cur b{position:absolute;right:2px;bottom:0;font:700 11px system-ui;color:#fff;text-shadow:1px 1px 0 #3f3f3f}
.sl em{position:absolute;left:2px;top:0;font:600 9px system-ui;color:#fff;text-shadow:0 0 3px #000;font-style:normal}
.sl i{position:absolute;left:3px;right:3px;bottom:2px;height:3px;background:#222;overflow:hidden}
.sl i u{display:block;height:100%}
#joy{position:fixed;z-index:2;display:none;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid rgba(255,255,255,.75);background:rgba(0,0,0,.15);pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:rgba(255,255,255,.8)}
#tops,.tb{display:none}
.touch #tops{display:flex}
.touch .tb{display:flex}
#tops{position:fixed;z-index:4;top:calc(8px + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px));gap:6px}
#tops button{font:600 13px system-ui;padding:9px 13px;border-radius:8px;border:0;background:var(--panel);color:var(--ink)}
#tops button.dn{background:var(--sel);color:#1d2419}
.tb{position:fixed;z-index:4;width:62px;height:62px;border-radius:50%;background:var(--panel);color:var(--ink);border:2px solid rgba(0,0,0,.25);font:600 12px system-ui;align-items:center;justify-content:center;opacity:.9}
.tb.dn{background:var(--sel);color:#1d2419}
#bJmp{right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(112px + env(safe-area-inset-bottom,0px))}
#bBrk{right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(184px + env(safe-area-inset-bottom,0px))}
#bPlc{right:calc(86px + env(safe-area-inset-right,0px));bottom:calc(148px + env(safe-area-inset-bottom,0px))}
#bDn{left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(112px + env(safe-area-inset-bottom,0px));width:50px;height:50px}
#inv{position:fixed;z-index:5;inset:0;display:none;align-items:center;justify-content:center;background:var(--veil);padding:10px;box-sizing:border-box}
#inv.on{display:flex}
#pn{background:#c6c6c6;color:#3f3f3f;border:3px solid;border-color:#fff #555 #555 #fff;border-radius:0;padding:12px;max-width:560px;width:100%;max-height:100%;overflow:auto;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;touch-action:pan-y}
#pn>*{flex:none}
#ph{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
#ph h2{margin:0;font-size:19px}
#pa button,.cb button,#chips button{font:700 12px system-ui;padding:7px 10px;border-radius:0;border:2px solid;border-color:#fff #373737 #373737 #fff;background:#8b8b8b;color:#fff;text-shadow:1px 1px 0 #3f3f3f;cursor:pointer;margin-left:4px}
#pa button:active,.cb button:active,#chips button:active{border-color:#373737 #fff #fff #373737}
.g{display:grid;gap:2px;justify-content:center}
.row{display:flex;align-items:center;justify-content:center;gap:14px}
.arr{font-size:22px}
.fcol{display:flex;flex-direction:column;align-items:center;gap:6px}
.bar{width:var(--ss);height:6px;background:#333;overflow:hidden}
.bar u{display:block;height:100%;width:0;background:#f0a030}
.crow{display:flex;align-items:center;justify-content:center;gap:14px}
.crow canvas{width:48px;height:96px;image-rendering:pixelated;background:#8b8b8b;border:2px solid;border-color:#373737 #fff #fff #373737;display:block;box-sizing:content-box}
.cb{display:grid;grid-template-columns:repeat(2,auto);gap:6px}
.cb button{margin-left:0;display:flex;align-items:center;gap:6px}
.cb i{width:12px;height:12px;display:inline-block;border:1px solid rgba(0,0,0,.5)}
.cb .wide{grid-column:span 2;background:#6b7ccf;justify-content:center}
#sq{width:100%;box-sizing:border-box;padding:8px 10px;border-radius:0;border:2px solid;border-color:#373737 #fff #fff #373737;background:#fff;color:#000;font:15px system-ui;user-select:text;-webkit-user-select:text}
#chips{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
#chips button{margin-left:0;padding:5px 8px}
#chips button.on{background:#6b7ccf}
#pal{display:grid;grid-template-columns:repeat(auto-fill,var(--ss));gap:2px;justify-content:center;max-height:min(250px,36vh);overflow:auto;touch-action:pan-y}
#cur{position:fixed;z-index:30;pointer-events:none;width:var(--ss);height:var(--ss);display:none}
#menu{position:fixed;z-index:9;inset:0;display:flex;align-items:center;justify-content:center;background:var(--veil);cursor:pointer;padding:16px;box-sizing:border-box}
#menu div{background:#c6c6c6;color:#3f3f3f;border:3px solid;border-color:#fff #555 #555 #fff;padding:24px 28px;max-width:400px;line-height:1.55;font-size:15px}
#menu h1{margin:0 0 8px;font-size:28px;letter-spacing:-.01em}
#menu p{margin:6px 0}
</style>
</head>

<canvas id="cv"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
if(typeof THREE==='undefined'){document.querySelector('#menu div').innerHTML='<h1>Couldn’t load three.js</h1><p>The game needs an internet connection to download the three.js library. Check your connection, then reload the page.</p>'}
</script>
<script>
const touch=matchMedia('(pointer:coarse)').matches;
document.body.classList.toggle('touch',touch);
const W=touch?128:192,D=W,H=192,CS=16,NC=W/CS,OFF=56,SEA=OFF+22,DSY=OFF-8,SEED=Math.random()*1000,AH=64,TS=32,DAYLEN=420,ITB=300,NETH=128,LAVAY=32;
let dim=0;
const world=new Uint8Array(W*H*D),hm=new Int16Array(W*D);
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const hx=n=>'#'+n.toString(16).padStart(6,'0');

/* ---------- blocks: [name, top tile, side tile, bottom tile, transparent?, group] ---------- */
const BL=[null,['Grass',0,1,2],['Dirt',2,2,2],['Stone',3,3,3],['Sand',4,4,4],['Wood',6,5,6],['Leaves',7,7,7],['Planks',8,8,8],['Cobblestone',9,9,9],['Brick',10,10,10],['Snow',11,12,2],['Glass',14,14,14,1],['Lamp',21,21,21],['Cactus',20,19,20],['Sandstone',23,23,23],['Coal ore',15,15,15],['Iron ore',16,16,16],['Gold ore',17,17,17],['Diamond ore',18,18,18],['Water',13,13,13,1],['Bedrock',22,22,22],['Gravel',24,24,24],['Clay',25,25,25],['Stone bricks',26,26,26],['Obsidian',27,27,27],['Ice',28,28,28,1],['Birch wood',6,29,6],['Dark planks',30,30,30],['Bookshelf',8,31,8],['White wool',32,32,32],['Red wool',33,33,33],['Blue wool',34,34,34],['Green wool',35,35,35],['Yellow wool',36,36,36],['Black wool',37,37,37],['Jack o’lantern',39,38,39],['Mossy cobblestone',40,40,40]];
const WATER=19,GLOW=[12,35],PAL=[];
const isOpq=t=>t>0&&!BL[t][4];

/* ---------- procedural texture atlas: 16x16 pixel-art tiles, drawn at 2x (32px) ---------- */
const AT=document.createElement('canvas');AT.width=8*TS;AT.height=AH*TS;
const ac=AT.getContext('2d');
const R=(i,x,y)=>{const n=Math.sin((i*37.3+x*12.9898+y*78.233)*1.7)*43758.5453;return n-Math.floor(n)};
const sh=(c,r,v)=>c.map(u=>Math.max(0,Math.min(255,u*(1+(r-.5)*(v||.25)))));
function tile(i,fn){
  const im=ac.createImageData(TS,TS),d=im.data;
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){
    const X=2*x+(x&1),Y=2*y+(y&1),c=fn(x,y,R(i,x,y),R(i+99,x,y),X,Y),a=c.length>3?c[3]:255,f=1+(R(i+313,x,y)-.5)*.1;
    for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++){
      const k=((2*y+dy)*TS+2*x+dx)*4;
      d[k]=c[0]*f;d[k+1]=c[1]*f;d[k+2]=c[2]*f;d[k+3]=a;
    }
  }
  ac.putImageData(im,(i%8)*TS,(i>>3)*TS);
}
function vor(X,Y,s,cs){
  const n=32/cs,cx=Math.floor(X/cs),cy=Math.floor(Y/cs);let d1=9e9,d2=9e9,id=0;
  for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){
    const gx=cx+i,gy=cy+j,wx=((gx%n)+n)%n,wy=((gy%n)+n)%n,px=(gx+R(s,wx,wy))*cs,py=(gy+R(s+1,wx,wy))*cs,d=Math.hypot(X-px,Y-py);
    if(d<d1){d2=d1;d1=d;id=R(s+2,wx,wy)}else if(d<d2)d2=d;
  }
  return[d1,d2,id];
}
const GR=[98,168,62],DI=[134,96,67],ST=[128,128,128],SN=[246,249,252];
const dirtC=(X,Y,i)=>{const p=R(13+i,X>>1,Y>>1);return p>.92?[170,136,104]:p<.08?[90,62,40]:p>.5?[140,102,72]:[126,90,62]};
const stoneC=(X,Y,i)=>{const v=vor(X,Y,31+i,16),cr=(v[1]-v[0])<1.2?.76:1,b=1+(R(35+i,X>>3,Y>>3)-.5)*.14;return ST.map(u=>u*cr*b)};
const deepC=(X,Y,i)=>[68,68,78].map(u=>u*(.92+R(95+i,X>>2,Y>>1)*.16));
const netC=(X,Y,i)=>{const p=R(i+7,X>>1,Y>>1);return p>.85?[150,60,56]:p<.15?[84,26,26]:[112,40,40]};
const oreT=(i,col,bf)=>(x,y,r,q,X,Y)=>{
  const v=vor(X,Y,79+i,8);
  if(v[2]>.55&&v[0]<2.2+v[2]*1.6)return sh(col.map(u=>u*((X+Y)%6<2?1.25:1)),r,.25);
  return sh(bf(X,Y,i),r,.1);
};
tile(0,(x,y,r,q,X,Y)=>{const g=R(7,X,Y>>2)*.6+R(8,X>>1,Y>>1)*.4;return sh(g>.62?[126,196,74]:g>.3?GR:[74,134,46],r,.14)});
tile(1,(x,y,r,q,X,Y)=>{const e=5+R(11,X,0)*8;if(Y<e)return sh(R(7,X,Y>>2)>.5?[120,190,72]:GR,r,.14);const c=dirtC(X,Y,0);return sh(Y<e+3?c.map(u=>u*.8):c,r,.1)});
tile(2,(x,y,r,q,X,Y)=>sh(dirtC(X,Y,0),r,.1));
tile(3,(x,y,r,q,X,Y)=>sh(stoneC(X,Y,0),r,.12));
tile(4,(x,y,r,q,X,Y)=>{const s=R(23,X,Y);return sh(s>.82?[240,228,174]:s<.18?[204,190,134]:[226,213,155],r,.05)});
tile(5,(x,y,r,q,X,Y)=>{if(Math.hypot(X-10,Y-21)<2.6)return[60,42,26];const g=R(41,X>>1,0)*.5+R(43,X,Y>>3)*.3;return sh(g>.45?[86,62,38]:[112,84,52],r,.12)});
tile(6,(x,y,r,q,X,Y)=>{const d=Math.max(Math.abs(X-15.5),Math.abs(Y-15.5));if(d>13.5)return sh([86,62,38],r,.2);return sh(Math.sin(d*1.35+R(47,X>>2,Y>>2)*.6)>0?[170,136,86]:[142,110,66],r,.1)});
tile(7,(x,y,r,q,X,Y)=>{const l=R(53,X>>1,Y>>1);let c=l>.65?[86,170,62]:l>.3?[62,146,46]:[40,108,34];if(R(55,X,Y)>.93)c=[110,190,80];return sh(c,r,.1)});
tile(8,(x,y,r,q,X,Y)=>{if(Y%8===7)return sh([112,78,44],r,.1);const g=R(59,X,Y>>3)*.5+R(61,X>>3,Y>>3)*.3;return sh(g>.5?[198,154,94]:[184,142,84],r,.08)});
tile(9,(x,y,r,q,X,Y)=>{const v=vor(X,Y,67,8),g=108+v[2]*70;return(v[1]-v[0])<1.3?[70,70,72]:sh([g,g,g+4],r,.1)});
tile(10,(x,y,r,q,X,Y)=>{const row=Y>>3,off=(row&1)*8;if(Y%8===7||(X+off)%16===15)return sh([190,186,176],r,.1);const v=R(71,(X+off)>>4,row)*.3+.85;return sh([160*v,70*v,54*v],r,.12)});
tile(11,(x,y,r,q,X,Y)=>R(73,X,Y)>.97?[255,255,255]:sh(SN,r,.04));
tile(12,(x,y,r,q,X,Y)=>{const e=5+R(75,X,0)*8;if(Y<e)return sh(SN,r,.04);const c=dirtC(X,Y,0);return sh(Y<e+3?c.map(u=>u*.8):c,r,.1)});
tile(13,(x,y,r)=>[...sh([48,108,212],r,.12),175]);
tile(14,(x,y)=>(x%15===0||y%15===0)?[210,235,245,255]:((x===y||x===y+1)&&x>3&&x<9)?[255,255,255,150]:[200,230,245,40]);
[[15,[28,28,28]],[16,[218,176,148]],[17,[252,222,60]],[18,[92,232,232]]].forEach(o=>tile(o[0],oreT(o[0],o[1],stoneC)));
tile(19,(x,y,r)=>x%4===2?sh([30,100,40],r,.2):sh([46,128,54],r,.25));
tile(20,(x,y,r)=>Math.max(Math.abs(x-7.5),Math.abs(y-7.5))>6.5?sh([30,100,40],r,.2):sh([66,150,70],r,.2));
tile(21,(x,y,r)=>(x%8===0||y%8===0)?sh([200,150,60],r,.1):sh([255,226,140],r,.18));
tile(22,(x,y,r)=>sh([48,48,48],r,.9));
tile(23,(x,y,r)=>y%5===4?sh([200,182,124],r,.1):sh([220,202,142],r,.12));
tile(24,(x,y,r,q,X,Y)=>{const v=vor(X,Y,89,8),g=90+v[2]*90;return(v[1]-v[0])<1.1?[56,54,52]:sh([g,g*.97,g*.94],r,.1)});
tile(25,(x,y,r)=>sh([160,166,178],r,.14));
tile(26,(x,y,r)=>(y%8===7||(x+((y>>3)&1)*8)%16===7)?sh([88,88,88],r,.15):sh([136,136,136],r,.12));
tile(27,(x,y,r,q)=>q>.93?sh([120,70,200],r,.3):sh([26,18,42],r,.5));
tile(28,(x,y,r)=>[...sh([170,210,250],r,.12),205]);
tile(29,(x,y,r,q)=>(q>.85||(y%7===3&&x%6<3))?sh([44,44,44],r,.3):sh([228,224,210],r,.1));
tile(30,(x,y,r)=>y%4===3?sh([60,40,24],r,.15):sh([96,66,38],r,.14));
tile(31,(x,y,r)=>(y<2||y>13||(y>6&&y<9))?sh([188,144,84],r,.14):sh([[150,50,40],[50,80,150],[60,130,60]][(x>>1)%3],r,.4));
[[236,236,232],[172,48,44],[52,72,172],[70,110,40],[230,200,50],[28,28,32]].forEach((c,i)=>tile(32+i,(x,y,r,q,X,Y)=>sh(c.map(u=>u*(((X>>1)+(Y>>1))&1?1.05:.95)),r,.08)));
/* pumpkin: ridged lobes, stem on top, carved glowing face for the jack o’lantern */
const PC=[222,122,26];
const pumpS=(x,y,r,q,X,Y)=>{
  const lobe=Math.sin(X*Math.PI/4),g=.8+.2*(lobe*.5+.5);
  if(X%8===0)return[146,74,12];
  const v=(R(201,X>>1,Y>>2)-.5)*.1;
  return sh(PC.map(u=>u*(g+v)),r,.04);
};
const pumpT=(x,y,r,q,X,Y)=>{
  const dx=X-15.5,dy=Y-15.5,d=Math.hypot(dx,dy);
  if(Math.abs(dx)<5.5&&Math.abs(dy)<5.5)return(Math.abs(dx)>4||Math.abs(dy)>4)?[52,70,28]:[102,126,48];
  const ridge=.82+.18*Math.sin(Math.atan2(dy,dx)*8);
  return sh(PC.map(u=>u*ridge*(d>14?.8:1)),r,.05);
};
tile(38,(x,y,r,q,X,Y)=>{
  const tri=cx=>{const dy=Y-11;return dy>=-4&&dy<=3&&Math.abs(X-cx)<=((dy+4)*.5+.5)};
  const eyes=tri(9)||tri(23);
  const mouth=Y>=19&&Y<=26&&X>=6&&X<=25&&!(Y<=21&&((X-6)%6<2))&&!(Y>=24&&((X-3)%6<2));
  if(eyes||mouth){const g=1-Math.hypot(X-15.5,Y-17)/22;return sh([255,226,120].map(u=>u*(.8+.3*g)),r,.06)}
  return pumpS(x,y,r,q,X,Y);
});
tile(39,pumpT);
tile(40,(x,y,r,q)=>q>.55?sh([70,120,50],r,.4):sh(ST,R(40,x>>1,y>>1),.7));

/* ---------- extra blocks (generated) ---------- */
let TN=41;const ID={},DR={};

function matchRecipe(g,sz){
  const ids=g.map(s=>s?s.id:0);
  let x0=sz,x1=-1,y0=sz,y1=-1;
  for(let y=0;y<sz;y++)for(let x=0;x<sz;x++)if(ids[y*sz+x]){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}
  if(x1<0)return null;
  const w=x1-x0+1,h=y1-y0+1,cnt=ids.filter(Boolean).length;
  for(const r of SHP){
    if(r.rows.length!==h||r.rows[0].length!==w)continue;
    for(const flip of[0,1]){
      let ok=true;
      for(let y=0;y<h&&ok;y++)for(let x=0;x<w&&ok;x++){
        const ch=r.rows[y][flip?w-1-x:x],id=ids[(y0+y)*sz+x0+x];
        if(ch===' ')ok=!id;else ok=!!(id&&r.keys[ch].includes(id));
      }
      if(ok)return{id:r.out,n:r.n};
    }
  }
  for(const r of SHL){
    if(r.ing.length!==cnt)continue;
    const used=ids.filter(Boolean);let ok=true;
    for(const tag of r.ing){const i=used.findIndex(id=>tag.includes(id));if(i<0){ok=false;break}used.splice(i,1)}
    if(ok)return{id:r.out,n:r.n};
  }
  return null;
}

function noise(x,z){const xi=Math.floor(x),zi=Math.floor(z),xf=sm(x-xi),zf=sm(z-zi);
  const a=rnd(xi,zi),b=rnd(xi+1,zi),c=rnd(xi,zi+1),d=rnd(xi+1,zi+1);
  return a+(b-a)*xf+(c-a)*zf+(a-b-c+d)*xf*zf}

function trySpawn(t,x,z){

  const gy=hm[z*W+x],b=blk(x,gy,z);
  if(!b||FL[b]||b===6||b===13)return false;
  if(blk(x,gy+1,z)||blk(x,gy+2,z))return false;
  if(!MOB[t].hostile&&b!==1&&b!==10)return false;
  spawnMob(t,x+.5,gy+1,z+.5);return true;
}
function spawnNear(t,mn,mx){const a=Math.random()*6.283,r=mn+Math.random()*(mx-mn);return trySpawn(t,P.x+Math.sin(a)*r,P.z+Math.cos(a)*r)}
function spawnNearNether(t){

      a.x+=a.vx*dt;a.y+=a.vy*dt;a.z+=a.vz*dt;
      a.mesh.position.set(a.x,a.y,a.z);
      const pd=Math.hypot(a.x-P.x,(a.y-(P.y+.9))*.8,a.z-P.z);
      if(hard(Math.floor(a.x),Math.floor(a.y),Math.floor(a.z))||(dead<=0&&pd<1.1)||a.age>12){const ex=a.x,ey=a.y,ez=a.z;rmArrow(a);explode(ex,ey,ez,2.4)}

      const o=spat(a.x,a.y,a.z,20);if(o)blockSnd('wood','hit',o);

      if(dead<=0&&Math.abs(a.x-P.x)<.45&&a.y>P.y&&a.y<P.y+1.85&&Math.abs(a.z-P.z)<.45){hurtPlayer(3);gone=true}

}

function portalFrame(x,y,z,ax){

function breakPortal(x,y,z){

  const dusk=Math.max(0,1-Math.abs(e)/.3);
  SD.set(Math.cos(a),e,.4).normalize();
  SKYC.copy(cNight).lerp(cDay,dayK).lerp(cDusk,dusk*.5);
  const sunI=clamp(e*3,0,1);
  hemi.intensity=.22+.34*dayK;hemi.color.copy(WHITE).lerp(SKYC,.5);hemi.groundColor.setHex(0x5a4a38).multiplyScalar(.35+.65*dayK);
  sun.intensity=.62*sunI;sun.color.setHex(0xfff2dc).lerp(cDusk,dusk*.6);
  moon.intensity=.2*(1-sunI);
  const tx=Math.round(P.x),ty=Math.round(P.y),tz=Math.round(P.z);
  sun.target.position.set(tx,ty,tz);sun.position.set(tx+SD.x*120,ty+SD.y*120,tz+SD.z*120);
  moon.target.position.set(tx,ty,tz);moon.position.set(tx-SD.x*100,ty-SD.y*100,tz-SD.z*100);
  sunS.position.set(P.x+SD.x*250,P.y+SD.y*250,P.z+SD.z*250);
  moonS.position.set(P.x-SD.x*250,P.y-SD.y*250,P.z-SD.z*250);
  stars.position.set(P.x,P.y,P.z);stars.rotation.z=a;stars.material.opacity=clamp(1-dayK*1.6,0,1);
  matWs.color.setScalar(bright);matWf.color.setScalar(bright);matT.color.setScalar(bright);hmat.color.setScalar(bright);hmatC.color.setScalar(bright);partMat.color.setScalar(bright);
  cm.color.setScalar(.25+.75*dayK);
}

/* ---------- loop ---------- */
let last=performance.now(),lastY=-999;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(dead>0)dead-=dt;
  let hit0=null;
  if(playing){
    update(dt);
    wacc+=dt;if(wacc>.12){wacc=0;flowTick()}
    tod=(tod+dt/DAYLEN)%1;
    bowCd-=dt;
    mobsTick(dt);arrowsTick(dt);tntTick(dt);
    for(const c of CT.values())if(c.k==='f')furnTick(c,dt);
    if(panel&&panel.type==='furn')furnUiTick();
    if(surv){regenT+=dt;if(regenT>4){regenT=0;if(P.hp<20){P.hp++;renderHp()}}}
    if(!invOpen){hit0=rayAll();combat(dt,hit0)}
    else{atk=false;mine=null;crack.visible=false}
  }
  partsTick(dt);
  skyUpdate();
  wtS.offset.x=-(now/1000*.04)%1;wtF.offset.x=-(now/1000*.5)%1;
  const t0=performance.now();let nb=0;
  for(const ci of dirty){
    dirty.delete(ci);
    try{build(ci)}catch(e){console.warn('chunk rebuild failed',ci,e)}
    if(++nb>=6||performance.now()-t0>8)break;
  }
  for(const c of clouds){c.position.x+=dt*1.5;if(c.position.x>W+80)c.position.x=-80}
  placeCamera(dt);updPlayerModel(dt);
  const cX=Math.floor(camera.position.x),cY=Math.floor(camera.position.y),cZ=Math.floor(camera.position.z);
  const uw=camera.position.y-cY<wh(cX,cY,cZ),lv=blk(cX,cY,cZ)===LAVA;
  if(playing)ambient(dt,uw);
  if(lv){scene.fog.color.setHex(0xe0500c);scene.fog.near=.1;scene.fog.far=3.5}
  else if(uw){scene.fog.color.setHex(0x1d55a0).multiplyScalar(.3+.7*dayK);scene.fog.near=1;scene.fog.far=24}
  else if(dim){scene.fog.color.copy(SKYC);scene.fog.near=8;scene.fog.far=78}
  else{scene.fog.color.copy(SKYC);scene.fog.near=35+25*dayK;scene.fog.far=105+45*dayK}
  scene.background.copy(scene.fog.color);
  const hs=slots[si],glowHeld=hs&&hs.id<ITB&&GF[hs.id];
  plight.position.copy(camera.position);plight.intensity=glowHeld?1.1:0;
  const hv=Math.hypot(P.vx,P.vz),sw=swingT>0?Math.sin((1-swingT/.3)*Math.PI):0;
  hand.position.set(.5,-.46+Math.sin(P.bob*3)*.012*Math.min(1,hv/4)-sw*.1,-.9-sw*.1);
  hand.rotation.set(-sw*1.1,-.15,-sw*.4);
  if(boomT>0){boomT-=dt;const k=1-clamp(boomT/.5,0,1);boom.visible=boomT>0;boom.scale.setScalar(boomR*(.5+k*1.3));boom.material.opacity=.7*(1-k)}else boom.visible=false;
  const yv=Math.floor(P.y);if(yv!==lastY){lastY=yv;$('pos').textContent=(dim?'Nether  ':'')+'Y '+yv+' / '+(topY()-1)}
  const hb=hit0&&hit0.blk;
  box.visible=!!hb;if(hb)box.position.set(hb.x+.5,hb.y+.5,hb.z+.5);
  renderer.render(scene,camera);
}
requestAnimationFrame(frame);
</script>
