<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Blockcraft</title>
<style>
:root{--panel:rgba(255,255,255,.9);--ink:#1d2419;--sel:#ffd23f;--veil:rgba(20,30,15,.55);--ss:min(44px,calc((100vw - 76px)/9))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:rgba(24,30,22,.9);--ink:#eef3e8;--veil:rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--panel:rgba(24,30,22,.9);--ink:#eef3e8;--veil:rgba(0,0,0,.6)}
html,body{margin:0;height:100%;overflow:hidden;background:#8ec9ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#cross{position:fixed;left:50%;top:50%;width:20px;height:20px;margin:-10px;pointer-events:none;mix-blend-mode:difference}
#cross:before,#cross:after{content:"";position:absolute;background:#fff}
#cross:before{left:9px;top:0;width:2px;height:20px}
#cross:after{top:9px;left:0;height:2px;width:20px}
#dmg{position:fixed;inset:0;z-index:7;pointer-events:none;background:radial-gradient(transparent 40%,rgba(200,0,0,.7));opacity:0}
#msg{position:fixed;top:16%;left:50%;transform:translateX(-50%);z-index:8;padding:8px 16px;border-radius:10px;background:var(--panel);color:var(--ink);opacity:0;transition:opacity .4s;pointer-events:none;font-weight:600}
#hud{position:fixed;z-index:3;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:5px}
#name{padding:2px 10px;border-radius:6px;background:var(--panel);color:var(--ink);font-size:13px;min-height:18px}
#bar{display:flex;gap:4px;padding:5px;background:var(--panel);border-radius:10px}
#hp{display:none;gap:1px}
.surv #hp{display:flex}
#hp span{color:#444;font-size:16px;line-height:1;text-shadow:0 0 2px #000}
#hp .f{color:#e53935}
#hp .h{color:#ff9a3d}
.sl{width:var(--ss);height:var(--ss);box-sizing:border-box;border-radius:6px;border:2px solid rgba(128,128,128,.5);background:rgba(128,128,128,.18);position:relative;cursor:pointer;overflow:hidden;touch-action:pan-y}
.sl.on{border-color:var(--sel)}
.sl canvas,#cur canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.sl b,#cur b{position:absolute;right:2px;bottom:0;font:700 11px system-ui;color:#fff;text-shadow:0 0 3px #000}
.sl em{position:absolute;left:2px;top:0;font:600 9px system-ui;color:#fff;text-shadow:0 0 3px #000;font-style:normal}
.sl i{position:absolute;left:3px;right:3px;bottom:2px;height:3px;background:#222;border-radius:2px;overflow:hidden}
.sl i u{display:block;height:100%}
#joy{position:fixed;z-index:2;display:none;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid rgba(255,255,255,.75);background:rgba(0,0,0,.15);pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:rgba(255,255,255,.8)}
#tops,.tb{display:none}
.touch #tops{display:flex}
.touch .tb{display:flex}
#tops{position:fixed;z-index:4;top:calc(8px + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px));gap:6px}
#tops button{font:600 13px system-ui;padding:9px 13px;border-radius:8px;border:0;background:var(--panel);color:var(--ink)}
#tops button.dn{background:var(--sel);color:#1d2419}
.tb{position:fixed;z-index:4;width:62px;height:62px;border-radius:50%;background:var(--panel);color:var(--ink);border:2px solid rgba(0,0,0,.25);font:600 12px system-ui;align-items:center;justify-content:center;opacity:.9}
.tb.dn{background:var(--sel);color:#1d2419}
#bJmp{right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(112px + env(safe-area-inset-bottom,0px))}
#bBrk{right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(184px + env(safe-area-inset-bottom,0px))}
#bPlc{right:calc(86px + env(safe-area-inset-right,0px));bottom:calc(148px + env(safe-area-inset-bottom,0px))}
#bDn{left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(112px + env(safe-area-inset-bottom,0px));width:50px;height:50px}
#inv{position:fixed;z-index:5;inset:0;display:none;align-items:center;justify-content:center;background:var(--veil);padding:10px;box-sizing:border-box}
#inv.on{display:flex}
#pn{background:var(--panel);color:var(--ink);border-radius:14px;padding:12px;max-width:560px;width:100%;max-height:100%;overflow:auto;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;touch-action:pan-y}
#pn>*{flex:none}
#ph{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
#ph h2{margin:0;font-size:19px}
#pa button{font:600 13px system-ui;padding:7px 12px;border-radius:8px;border:0;background:var(--sel);color:#1d2419;cursor:pointer;margin-left:4px}
.g{display:grid;gap:4px;justify-content:center}
.row{display:flex;align-items:center;justify-content:center;gap:14px}
.arr{font-size:22px}
.fcol{display:flex;flex-direction:column;align-items:center;gap:6px}
.bar{width:var(--ss);height:6px;background:#333;border-radius:3px;overflow:hidden}
.bar u{display:block;height:100%;width:0;background:#f0a030}
#sq{width:100%;box-sizing:border-box;padding:8px 10px;border-radius:8px;border:1px solid rgba(128,128,128,.5);background:rgba(128,128,128,.12);color:var(--ink);font:15px system-ui;user-select:text;-webkit-user-select:text}
#chips{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
#chips button{font:600 12px system-ui;padding:5px 9px;border-radius:14px;border:1px solid rgba(128,128,128,.5);background:transparent;color:var(--ink);cursor:pointer}
#chips button.on{background:var(--sel);color:#1d2419;border-color:var(--sel)}
#pal{display:grid;grid-template-columns:repeat(auto-fill,var(--ss));gap:4px;justify-content:center;max-height:min(250px,36vh);overflow:auto;touch-action:pan-y}
#cur{position:fixed;z-index:30;pointer-events:none;width:var(--ss);height:var(--ss);display:none}
#menu{position:fixed;z-index:9;inset:0;display:flex;align-items:center;justify-content:center;background:var(--veil);cursor:pointer;padding:16px;box-sizing:border-box}
#menu div{background:var(--panel);color:var(--ink);padding:24px 28px;border-radius:14px;max-width:400px;line-height:1.55;font-size:15px}
#menu h1{margin:0 0 8px;font-size:28px;letter-spacing:-.01em}
#menu p{margin:6px 0}
</style>
</head>

const HRD=[];

  const n=BL[id][0],g=BL[id][5],is=r=>r.test(n);
  let h=1.5,c=null,t=0,nd=false;
  if(id===20)h=1e9;
  else if(is(/netherite|ancient debris/i)){h=30;c='pick';t=3;nd=true}
  else if(is(/obsidian/i)){h=25;c='pick';t=3;nd=true}
  else if(is(/ore$/i)){h=3;c='pick';nd=true;t=is(/coal/i)?0:is(/iron|copper|lapis/i)?1:2}
  else if(is(/^tnt$/i))h=0;
  else if(is(/glass|^ice$|lamp|froglight|glowstone|sea lantern/i))h=.35;
  else if(is(/leaves/i)){h=.25;c='shears'}
  else if(is(/wool/i)){h=.8;c='shears'}
  else if(is(/hay|sponge|cactus|shroom|honey|kelp|sculk|mushroom/i))h=.6;
  else if(is(/sandstone/i)){h=2;c='pick';nd=true}
  else if(g==='Nature'||is(/sand$|dirt|gravel|clay|mud$/i)){h=.6;c='shovel';if(is(/packed|blue/i)){h=1;c='pick'}}
  else if(g==='Wood'||is(/crafting|chest|barrel|melon|pumpkin|jack|jukebox|note/i)){h=2;c='axe'}
  else if(g==='Metal'){h=5;c='pick';nd=true;t=is(/iron|copper|coal|quartz/i)?1:2}
  else if(g==='Stone'||g==='Color'||is(/furnace|smoker|bone|magma/i)){h=g==='Color'?1.6:2.2;c='pick';nd=true}
  HRD[id]={h,c,t,nd};

function dropOf(id,tool){
  const r=HRD[id];
  if(r.nd&&!(tool&&tool.cls===r.c&&tool.tier>=r.t))return null;
  if(id===6)return Math.random()<.08?{id:II.apple,n:1}:null;
  if(id===21)return{id:Math.random()<.15?II.flint:21,n:1};
  const d=id in DROPX?DROPX[id]:id;
  return d?{id:d,n:1}:null;
}

      const s=mkSlot({id:e.id,n:1,d:0},()=>{slots[si]=mkStack(e.id);renderPanel();renderHud()},false);
      s.title=nm(e.id);pl.appendChild(s);
    });
  }
  sq.oninput=()=>{pq=sq.value;fill()};
  fill();
}
function craftUI(sz){
  const row=document.createElement('div');row.className='row';
  const g=grid(sz);
  for(let i=0;i<sz*sz;i++)g.appendChild(mkSlot(CG[i],r=>{clickSlot(CG,i,r);renderPanel()}));
  const ar=document.createElement('span');ar.className='arr';ar.textContent='➜';
  const res=matchRecipe(CG,sz);
  const rs=mkSlot(res?{id:res.id,n:res.n,d:0}:null,()=>{takeCraft(sz);renderPanel()});
  row.append(g,ar,rs);$('pb').appendChild(row);
}
const sigOf=f=>f.a.map(s=>s?s.id+':'+s.n:'-').join('|');
function furnUI(){
  const f=CT.get(panel.key),row=document.createElement('div');row.className='row';
  const c1=document.createElement('div');c1.className='fcol';
  c1.appendChild(mkSlot(f.a[0],r=>{clickSlot(f.a,0,r);renderPanel()}));
  const fl=document.createElement('div');fl.className='bar';fl.innerHTML='<u></u>';c1.appendChild(fl);
  c1.appendChild(mkSlot(f.a[1],r=>{clickSlot(f.a,1,r);renderPanel()}));
  const c2=document.createElement('div');c2.className='fcol';
  const pr=document.createElement('div');pr.className='bar';pr.innerHTML='<u></u>';
  const lab=document.createElement('span');lab.className='arr';lab.textContent='➜';
  c2.append(lab,pr);
  row.append(c1,c2,mkSlot(f.a[2],r=>{clickSlot(f.a,2,r,'out');renderPanel()}));
  $('pb').appendChild(row);
  FUI={f,fl:fl.firstChild,pr:pr.firstChild,sig:sigOf(f)};
}
function furnUiTick(){
  if(!FUI)return;
  const f=FUI.f;
  if(sigOf(f)!==FUI.sig){renderPanel();return}
  FUI.fl.style.width=f.bmax?Math.max(0,f.burn/f.bmax*100)+'%':'0';
  FUI.pr.style.width=(f.prog/10*100)+'%';
}
function chestUI(){
  const c=CT.get(panel.key),g=grid(9);
  for(let i=0;i<27;i++)g.appendChild(mkSlot(c.a[i],r=>{clickSlot(c.a,i,r);renderPanel()}));
  $('pb').appendChild(g);
}
function renderPanel(){
  if(!panel)return;
  const ty=panel.type,pb=$('pb'),pm=$('pm'),pa=$('pa');
  pb.innerHTML='';pm.innerHTML='';pa.innerHTML='';FUI=null;
  $('pt').textContent={inv:'Inventory',craft:'Crafting table',furn:'Furnace',chest:'Storage'}[ty];
  const btn=(t,f)=>{const b=document.createElement('button');b.textContent=t;b.onclick=f;pa.appendChild(b)};
  if(ty==='inv')btn(surv?'Mode: Survival':'Mode: Creative',()=>setMode(!surv));
  btn('Trash',()=>{cur=null;renderPanel()});
  btn('Close',()=>closePanel());
  const cr=ty==='inv'&&!surv;
  if(cr)palette();
  else if(ty==='inv')craftUI(2);
  else if(ty==='craft')craftUI(3);
  else if(ty==='furn')furnUI();
  else chestUI();
  if(!cr){const g=grid(9);for(let i=9;i<36;i++)g.appendChild(mkSlot(slots[i],r=>{clickSlot(slots,i,r);renderPanel()}));pm.appendChild(g)}
  const g2=grid(9);
  for(let i=0;i<9;i++)g2.appendChild(mkSlot(slots[i],r=>{if(cr){if(r)slots[i]=null;else si=i}else clickSlot(slots,i,r);renderPanel();renderHud()},i===si,i+1));
  pm.appendChild(g2);
  updateCur();
}
function renderHud(){
  const b=$('bar');b.innerHTML='';
  for(let i=0;i<9;i++)b.appendChild(mkSlot(slots[i],()=>{si=i;renderHud()},i===si,i+1));
  const s=slots[si];
  $('name').textContent=s?nm(s.id)+(s.n>1?' ×'+s.n:''):'';
  setHand(s?s.id:0);
}
function openPanel(type,key){
  if(!playing)return;
  panel={type,key};invOpen=true;
  CG=type==='inv'?Array(4).fill(null):type==='craft'?Array(9).fill(null):[];
  $('inv').classList.add('on');
  for(const k in keys)keys[k]=false;resetTouch();atk=false;
  if(document.exitPointerLock)document.exitPointerLock();
  renderPanel();
}
function closePanel(q){
  if(!panel)return;
  CG.forEach(s=>s&&give(s.id,s.n,s.d));CG=[];
  if(cur){give(cur.id,cur.n,cur.d);cur=null}
  panel=null;invOpen=false;FUI=null;$('inv').classList.remove('on');$('cur').style.display='none';
  renderHud();if(!q)lock();
}
function toggleInv(){if(!playing)return;if(panel)closePanel();else openPanel('inv')}
function setMode(s){
  CG.forEach(x=>x&&give(x.id,x.n,x.d));CG=CG.map(()=>null);
  if(cur){give(cur.id,cur.n,cur.d);cur=null}
  surv=s;slots=s?MS.s:MS.c;si=Math.min(si,8);P.hp=20;
  document.body.classList.toggle('surv',s);
  renderHp();renderHud();renderPanel();
}
function toggleFly(){P.fly=!P.fly;P.vy=0;$('bFly').classList.toggle('dn',P.fly)}
function lock(){if(!touch)try{const p=cv.requestPointerLock();if(p&&p.catch)p.catch(()=>{})}catch(e){}}
renderHud();renderHp();

/* ---------- menu, keyboard & mouse ---------- */
const menu=$('menu');
$('mt').textContent=touch?'Tap anywhere to play.':'Press Enter or Space to play. (Clicking also works.)';
$('mh').innerHTML=touch
 ?'Left side: drag to move<br>Right side: drag to look<br>Hit (hold) mines or attacks. Use places, opens tables, eats, shoots a bow<br>Bag opens your inventory<br>Starts in creative; switch to survival with Mode in the Bag<br>Spawn eggs and every item are in the creative Bag<br>Landscape works best.'
 :'W A S D move, Space jump, Shift sprint<br>Hold E or left click: mine and attack<br>Q or right click: place, use, eat, shoot the bow, open tables, furnaces and chests<br>Shift + use places a block against a table<br>1–9 or the scroll wheel picks a hotbar slot<br>I opens your inventory (Mode button: creative or survival)<br>Spawn eggs and every item are in the creative inventory<br>F fly, T skip to morning<br>Esc pauses, Enter resumes';
function play(){
  playing=true;menu.style.display='none';lock();
  if(touch)try{document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}
}
function pause(){
  if(panel)closePanel(true);
  playing=false;atk=false;menu.style.display='flex';
  for(const k in keys)keys[k]=false;resetTouch();
}
menu.onclick=play;
$('bFly').onclick=toggleFly;$('bBag').onclick=toggleInv;$('bPause').onclick=pause;
document.addEventListener('pointerlockchange',()=>{if(!document.pointerLockElement&&playing&&!invOpen)pause()});
addEventListener('mousemove',e=>{
  if(!playing||invOpen||!document.pointerLockElement)return;
  P.yaw-=e.movementX*.0022;
  P.pitch=clamp(P.pitch-e.movementY*.0022,-1.55,1.55);
});
const curMove=e=>{if(cur){const c=$('cur');c.style.left=(e.clientX-20)+'px';c.style.top=(e.clientY-20)+'px'}};
addEventListener('pointermove',curMove);addEventListener('pointerdown',curMove);
addEventListener('keydown',e=>{
  if(e.target.id==='sq'){if(e.code==='Escape')e.target.blur();return}
  if(!playing){
    if(e.code==='Enter'||e.code==='Space'){e.preventDefault();play()}
    return;
  }
  if(invOpen){
    if(e.code==='KeyI'||e.code==='Escape'||e.code==='Tab'){e.preventDefault();closePanel()}
    else if(/^Digit[1-9]$/.test(e.code)){si=+e.code[5]-1;renderPanel();renderHud()}
    return;
  }
  if(e.code==='Escape'&&!document.pointerLockElement)return pause();
  if(e.code==='KeyI'||e.code==='Tab'){e.preventDefault();return toggleInv()}
  if(/^(Space|Arrow)/.test(e.code))e.preventDefault();
  keys[e.code]=true;
  if(e.code==='KeyF')toggleFly();
  if(e.code==='KeyE')atk=true;
  if(e.code==='KeyQ'&&!e.repeat)use();
  if(e.code==='KeyT'&&!e.repeat){tod=.13;toast('Morning')}
  if(/^Digit[1-9]$/.test(e.code)){si=+e.code[5]-1;renderHud()}
});
addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='KeyE')atk=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;atk=false});
addEventListener('wheel',e=>{if(playing&&!invOpen){si=(si+(e.deltaY>0?1:-1)+9)%9;renderHud()}});
addEventListener('contextmenu',e=>e.preventDefault());
const ui=t=>t.closest&&t.closest('#hud,#inv,.tb,#tops,#menu');
addEventListener('mousedown',e=>{
  if(!playing||invOpen||ui(e.target))return;
  if(!touch&&!document.pointerLockElement)lock();
  if(e.button===0)atk=true;else if(e.button===2)use();
});
addEventListener('mouseup',e=>{if(e.button===0)atk=false});

/* ---------- touch controls ---------- */
const joy=$('joy'),knob=$('knob');
let jid=null,lid=null,jo=[0,0],lp=[0,0];
function resetTouch(){jid=lid=null;T.jx=T.jy=T.jump=T.sink=0;joy.style.display='none'}
addEventListener('touchstart',e=>{
  if(!playing||invOpen)return;
  for(const t of e.changedTouches){
    if(ui(t.target))continue;
    e.preventDefault();
    if(t.clientX<innerWidth*.45&&jid===null){
      jid=t.identifier;jo=[t.clientX,t.clientY];
      joy.style.cssText='display:block;left:'+jo[0]+'px;top:'+jo[1]+'px';knob.style.transform='none';
    }else if(lid===null){lid=t.identifier;lp=[t.clientX,t.clientY]}
  }
},{passive:false});
addEventListener('touchmove',e=>{
  if(!playing||invOpen)return;
  for(const t of e.changedTouches){
    if(t.identifier===jid){
      let dx=t.clientX-jo[0],dy=t.clientY-jo[1];const d=Math.hypot(dx,dy),RR=50;
      if(d>RR){dx*=RR/d;dy*=RR/d}
      T.jx=d<10?0:dx/RR;T.jy=d<10?0:-dy/RR;knob.style.transform='translate('+dx+'px,'+dy+'px)';
    }else if(t.identifier===lid){
      P.yaw-=(t.clientX-lp[0])*.006;
      P.pitch=clamp(P.pitch-(t.clientY-lp[1])*.006,-1.55,1.55);
      lp=[t.clientX,t.clientY];
    }
  }
  e.preventDefault();
},{passive:false});
const tEnd=e=>{for(const t of e.changedTouches){
  if(t.identifier===jid){jid=null;T.jx=T.jy=0;joy.style.display='none'}
  if(t.identifier===lid)lid=null;
}};
addEventListener('touchend',tEnd);addEventListener('touchcancel',tEnd);
function hold(id,on,off,rep){
  const e=$(id);let iv=0;
  const s=ev=>{ev.preventDefault();ev.stopPropagation();e.classList.add('dn');on();if(rep)iv=setInterval(on,rep)};
  const x=ev=>{ev.preventDefault();e.classList.remove('dn');clearInterval(iv);if(off)off()};
  e.addEventListener('touchstart',s,{passive:false});e.addEventListener('touchend',x);e.addEventListener('touchcancel',x);
}
hold('bBrk',()=>{if(playing&&!invOpen)atk=true},()=>{atk=false});
hold('bPlc',()=>{use()});
hold('bJmp',()=>{T.jump=1},()=>{T.jump=0});
hold('bDn',()=>{T.sink=1},()=>{T.sink=0});

/* ---------- sky update ---------- */
function skyUpdate(){
  const a=tod*6.2832,e=Math.sin(a);
  dayK=sm01(-.12,.3,e);bright=.3+.7*dayK;
  const dusk=Math.max(0,1-Math.abs(e)/.3);
  SD.set(Math.cos(a),e,.4).normalize();
  SKYC.copy(cNight).lerp(cDay,dayK).lerp(cDusk,dusk*.5);
  const sunI=clamp(e*3,0,1);
  hemi.intensity=.22+.34*dayK;hemi.color.copy(WHITE).lerp(SKYC,.5);hemi.groundColor.setHex(0x5a4a38).multiplyScalar(.35+.65*dayK);
  sun.intensity=.62*sunI;sun.color.setHex(0xfff2dc).lerp(cDusk,dusk*.6);
  moon.intensity=.2*(1-sunI);
  const tx=Math.round(P.x),ty=Math.round(P.y),tz=Math.round(P.z);
  sun.target.position.set(tx,ty,tz);sun.position.set(tx+SD.x*120,ty+SD.y*120,tz+SD.z*120);
  moon.target.position.set(tx,ty,tz);moon.position.set(tx-SD.x*100,ty-SD.y*100,tz-SD.z*100);
  sunS.position.set(P.x+SD.x*250,P.y+SD.y*250,P.z+SD.z*250);
  moonS.position.set(P.x-SD.x*250,P.y-SD.y*250,P.z-SD.z*250);
  stars.position.set(P.x,P.y,P.z);stars.rotation.z=a;stars.material.opacity=clamp(1-dayK*1.6,0,1);
  matWs.color.setScalar(bright);matWf.color.setScalar(bright);matT.color.setScalar(bright);hmat.color.setScalar(bright);
  cm.color.setScalar(.25+.75*dayK);
}

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(dead>0)dead-=dt;
  let hit0=null;
  if(playing){
    update(dt);
    wacc+=dt;if(wacc>.12){wacc=0;flowTick()}
    tod=(tod+dt/DAYLEN)%1;
    bowCd-=dt;
    mobsTick(dt);arrowsTick(dt);tntTick(dt);
    for(const c of CT.values())if(c.k==='f')furnTick(c,dt);
    if(panel&&panel.type==='furn')furnUiTick();
    if(surv){regenT+=dt;if(regenT>4){regenT=0;if(P.hp<20){P.hp++;renderHp()}}}
    if(!invOpen){hit0=rayAll();combat(dt,hit0)}
    else{atk=false;mine=null;crack.visible=false}
  }
  skyUpdate();
  wtS.offset.x=-(now/1000*.04)%1;wtF.offset.x=-(now/1000*.5)%1;
  let nb=0;for(const ci of dirty){dirty.delete(ci);build(ci);if(++nb>=4)break}
  for(const c of clouds){c.position.x+=dt*1.5;if(c.position.x>W+80)c.position.x=-80}
  camera.position.set(P.x,P.y+1.62,P.z);camera.rotation.set(P.pitch,P.yaw,0);
  const cy=Math.floor(camera.position.y),uw=camera.position.y-cy<wh(Math.floor(P.x),cy,Math.floor(P.z));
  if(uw){scene.fog.color.setHex(0x1d55a0).multiplyScalar(.3+.7*dayK);scene.fog.near=1;scene.fog.far=24}
  else{scene.fog.color.copy(SKYC);scene.fog.near=35+25*dayK;scene.fog.far=105+45*dayK}
  scene.background.copy(scene.fog.color);
  const hs=slots[si],glowHeld=hs&&hs.id<ITB&&GF[hs.id];
  plight.position.copy(camera.position);plight.intensity=glowHeld?1.1:0;
  const hv=Math.hypot(P.vx,P.vz),sw=swingT>0?Math.sin((1-swingT/.3)*Math.PI):0;
  hand.position.set(.5,-.46+Math.sin(P.bob*3)*.012*Math.min(1,hv/4)-sw*.1,-.9-sw*.1);
  hand.rotation.set(-sw*1.1,-.15,-sw*.4);
  if(boomT>0){boomT-=dt;const k=1-clamp(boomT/.5,0,1);boom.visible=boomT>0;boom.scale.setScalar(boomR*(.5+k*1.3));boom.material.opacity=.7*(1-k)}else boom.visible=false;
  const hb=hit0&&hit0.blk;
  box.visible=!!hb;if(hb)box.position.set(hb.x+.5,hb.y+.5,hb.z+.5);
  renderer.render(scene,camera);
}
requestAnimationFrame(frame);
</script>
